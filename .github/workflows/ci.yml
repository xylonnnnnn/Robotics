name: ROS practices

on: [push, pull_request]

env:
  COURSE_KIT_URL: https://ros.lms.ci.nsu.ru/downloads/robotics-course-kit-v1-w02-5d210c431e32.tar.gz
  COURSE_KIT_SHA256: 5d210c431e32418f45e2cffa9dd2028116c7a9520a36f3c7079c778cd73437a8
  COURSE_KIT_PR03_URL: https://ros.lms.ci.nsu.ru/downloads/robotics-course-kit-v1-w05-bca214e3de6f.tar.gz
  COURSE_KIT_PR03_SHA256: bca214e3de6f90f9513049dfa0f36fee65ad834da502dc3f3f8fb443517b5197

jobs:
  verify:
    runs-on: ubuntu-latest
    container: ros:jazzy-ros-base
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install dependencies
        shell: bash
        run: |
          set -eo pipefail
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl git python3-colcon-common-extensions python3-pytest ros-jazzy-turtlesim xvfb
      - name: Validate PR01 environment JSON
        shell: bash
        run: |
          set -eo pipefail
          if test -f PR01/evidence/pr01/environment.json; then
            python3 -m json.tool PR01/evidence/pr01/environment.json > /dev/null
          fi
      - name: Build PR02 launch package
        shell: bash
        run: |
          set -eo pipefail
          if test -f PR02/src/turtle_bringup/package.xml; then
            cd PR02
            source /opt/ros/jazzy/setup.bash
            colcon build --symlink-install --packages-select turtle_bringup
            source install/setup.bash
            test -f "$(ros2 pkg prefix turtle_bringup)/share/turtle_bringup/launch/sim.launch.py"
            python3 -m py_compile src/turtle_bringup/launch/sim.launch.py
          fi
      - name: Build and test PR03 patrol
        shell: bash
        run: |
          set -eo pipefail
          if test -f PRO3/src/patrol/package.xml; then
            cd PRO3
            source /opt/ros/jazzy/setup.bash
            colcon build --symlink-install --base-paths ../PR02/src src --packages-select turtle_bringup patrol
            source install/setup.bash
            colcon test --packages-select patrol --event-handlers console_direct+
            python3 -m pytest -q src/patrol/test
            PR03_EVIDENCE_DIR=/tmp/pr03-ci-evidence python3 tools/capture_pr03.py
          fi
      - name: Download pinned course kit
        shell: bash
        run: |
          set -eo pipefail
          curl -fSL --retry 3 --retry-delay 3 -o course-kit.tar.gz "$COURSE_KIT_URL"
          printf '%s  %s\n' "$COURSE_KIT_SHA256" course-kit.tar.gz | sha256sum -c -
          mkdir -p .course-kit
          tar -xzf course-kit.tar.gz -C .course-kit
          test "$(cat .course-kit/v1/VERSION)" = v1-w02
      - name: Download pinned PR03 course kit
        shell: bash
        run: |
          set -eo pipefail
          if test -f PRO3/src/patrol/package.xml; then
            curl -fSL --retry 3 --retry-delay 3 -o course-kit-pr03.tar.gz "$COURSE_KIT_PR03_URL"
            printf '%s  %s\n' "$COURSE_KIT_PR03_SHA256" course-kit-pr03.tar.gz | sha256sum -c -
            mkdir -p .course-kit/pr03
            tar -xzf course-kit-pr03.tar.gz -C .course-kit/pr03
            test "$(cat .course-kit/pr03/v1/VERSION)" = v1-w05
          fi
      - name: Check practice evidence
        shell: bash
        run: |
          set -eo pipefail
          if test -f PR01/evidence/pr01/report.json; then
            python3 .course-kit/v1/tools/check_practice.py PR01 --submission PR01
          fi
          if test -f PR02/evidence/pr02/report.json; then
            python3 .course-kit/v1/tools/check_practice.py PR02 --submission PR02
          fi
          if test -f PRO3/evidence/pr03/report.json; then
            python3 .course-kit/pr03/v1/tools/check_practice.py PR03 --submission PRO3
          fi

  pr04:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container: ros:jazzy-ros-base
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install PR04 dependencies
        shell: bash
        run: |
          set -eo pipefail
          apt-get update
          apt-get install -y --no-install-recommends git python3-colcon-common-extensions python3-pytest ros-jazzy-turtlesim
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Verify provided PR04 course kit
        shell: bash
        run: |
          set -eo pipefail
          (cd PRO4/course-kit && sha256sum -c SHA256SUMS)
          mkdir -p .course-kit/pr04
          tar -xzf PRO4/course-kit/pr04-v1-w07.tar.gz -C .course-kit/pr04
          test "$(cat .course-kit/pr04/v1/VERSION)" = v1-w07
          (cd .course-kit/pr04/v1 && sha256sum -c MANIFEST.sha256)
      - name: Build and test PR04
        shell: bash
        run: |
          set -eo pipefail
          cd PRO4
          source /opt/ros/jazzy/setup.bash
          colcon build --symlink-install --packages-select patrol
          source install/setup.bash
          colcon test --packages-select patrol --event-handlers console_direct+
          colcon test-result --verbose
          python3 -m pytest -q src/patrol/test
      - name: Reproduce historical zero-frequency defect
        shell: bash
        run: |
          set -eo pipefail
          cd PRO4
          source /opt/ros/jazzy/setup.bash
          source install/setup.bash
          PR04_EVIDENCE_DIR=/tmp/pr04-ci/broken python3 tools/capture_pr04.py --expect-defect --defect-commit 2d810caf454278eadec02af304d2d82eabf04697
      - name: Verify fixed stream and ROS interfaces
        shell: bash
        run: |
          set -eo pipefail
          cd PRO4
          source /opt/ros/jazzy/setup.bash
          source install/setup.bash
          PR04_EVIDENCE_DIR=/tmp/pr04-ci/fixed python3 tools/capture_pr04.py
      - name: Validate PR04 evidence contract
        shell: bash
        run: |
          set -eo pipefail
          python3 .course-kit/pr04/v1/tools/check_practice.py PR04 --submission PRO4
      - name: Upload PR04 runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr04-runtime-evidence
          path: |
            /tmp/pr04-ci
            PRO4/log
          if-no-files-found: warn
